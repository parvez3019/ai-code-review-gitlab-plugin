site_name: AI Code Review for GitLab
site_description: Self-hosted AI code review bot for GitLab merge requests. Inline review comments from Claude (AWS Bedrock or Anthropic), Gemini, OpenAI or local models via Ollama.
site_url: https://parvez3019.github.io/ai-code-review-gitlab-plugin/
repo_url: https://github.com/parvez3019/ai-code-review-gitlab-plugin
repo_name: parvez3019/ai-code-review-gitlab-plugin
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  # Google Search Console: paste the content="..." value of the HTML-tag verification here
  google_site_verification: ""
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/parvez3019/ai-code-review-gitlab-plugin
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/@parvez3019/ai-code-review-gitlab-plugin

nav:
  - Home: index.md
  - Getting started:
      - GitLab CI (npm): getting-started/gitlab-ci.md
      - One-line CI template: getting-started/ci-template.md
      - Docker image: getting-started/docker.md
      - Command line: getting-started/cli.md
  - Providers:
      - AWS Bedrock (Claude): providers/bedrock.md
      - Anthropic API: providers/anthropic.md
      - Google Gemini: providers/gemini.md
      - OpenAI-compatible & Ollama: providers/openai-compatible.md
  - Configuration:
      - CLI options: configuration/options.md
      - Environment variables: configuration/env-vars.md
      - Custom prompts: configuration/custom-prompts.md
  - Guides:
      - Trigger on reviewer assignment (webhook): guides/webhook-trigger.md
      - Trigger via the GitLab API: guides/trigger-via-api.md
      - Self-managed GitLab: guides/self-hosted-gitlab.md
  - Comparison: comparison.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Changelog: changelog.md
  - Contributing: contributing.md

exclude_docs: |
  requirements.txt
