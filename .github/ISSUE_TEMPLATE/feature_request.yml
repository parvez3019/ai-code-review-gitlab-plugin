name: Feature request
description: Suggest an idea or a new provider
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
  - type: checkboxes
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a PR for this
